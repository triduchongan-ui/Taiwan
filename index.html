<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Taiwanese Chinese - Phản Xạ Phòng Lab</title>
  <style>
    :root {
      --bg: #181c24;
      --card-bg: #222733;
      --sub-bg: #1b202b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --pinyin: #facc15;
      --vietnamese: #22c55e;
      --border: #334155;
      --danger: #ef4444;
      --warning: #d97706;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 650px;
      margin: 0 auto;
      padding: 20px;
    }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    button.tab-btn {
      flex: 1; padding: 12px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--muted); cursor: pointer;
      border-radius: 10px; font-weight: bold; font-size: 15px; transition: all 0.2s;
    }
    button.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .view { display: none; }
    .view.active { display: block; }

    .sync-status {
      font-size: 13px; text-align: center; margin-bottom: 12px; font-weight: 600; color: var(--muted);
    }
    .stat-box {
      text-align: center; padding: 10px; background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px; margin-bottom: 14px; font-weight: bold; color: #a5b4fc; font-size: 14px;
    }

    /* Thanh chọn chế độ xuất hiện thẻ */
    .mode-bar {
      display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .mode-btn {
      flex: 1; min-width: 120px; padding: 8px 10px; font-size: 12px; font-weight: bold;
      border-radius: 8px; border: 1px solid var(--border); background: var(--sub-bg);
      color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active {
      background: #312e81; color: #e0e7ff; border-color: var(--primary);
    }

    /* Thẻ Flashcard Dark Mode */
    .flashcard {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 22px; text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      margin-bottom: 18px;
    }
    .mode-badge {
      display: inline-block; font-size: 11px; font-weight: bold; padding: 4px 10px;
      border-radius: 999px; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-zh { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
    .badge-vi { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-audio { background: rgba(250, 204, 21, 0.2); color: #fde047; border: 1px solid rgba(250, 204, 21, 0.4); }

    .front-prompt-zh {
      font-size: 32px; font-weight: bold; color: #ffffff; margin-bottom: 18px; line-height: 1.4;
    }
    .front-prompt-vi {
      font-size: 22px; font-weight: bold; color: var(--vietnamese); margin-bottom: 18px; line-height: 1.5;
    }
    .front-prompt-audio {
      margin-bottom: 18px;
    }
    .big-audio-btn {
      background: #312e81; border: 2px solid var(--primary); color: white;
      border-radius: 50%; width: 64px; height: 64px; font-size: 28px; cursor: pointer;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); transition: transform 0.15s;
    }
    .big-audio-btn:active { transform: scale(0.95); }

    /* Ô gõ kiểm tra ngang */
    .input-row {
      display: flex; gap: 10px; margin-bottom: 12px;
    }
    .answer-input {
      flex: 1; padding: 12px 16px; font-size: 16px; background: var(--sub-bg);
      color: white; border: 1px solid var(--border); border-radius: 10px; outline: none;
    }
    .answer-input:focus { border-color: var(--primary); }
    .btn-check {
      padding: 12px 20px; background: var(--primary); color: white; border: none;
      border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;
    }
    .btn-check:hover { background: var(--primary-hover); }

    .flip-hint {
      font-size: 13px; color: var(--muted); cursor: pointer; margin-top: 6px; display: inline-block;
    }
    .flip-hint:hover { color: white; }

    /* Kết quả so sánh */
    .check-result {
      padding: 10px 14px; border-radius: 10px; margin: 14px 0; font-size: 14px; font-weight: 600; text-align: left;
    }
    .check-correct { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }
    .check-wrong { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

    /* Mặt sau đáp án chi tiết */
    .back-details {
      text-align: left; border-top: 1px solid var(--border); padding-top: 18px; margin-top: 16px;
    }
    .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .val-zh { font-size: 26px; font-weight: bold; color: #ffffff; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .val-pinyin { font-size: 18px; font-weight: bold; color: var(--pinyin); margin-bottom: 14px; }
    .val-vi { font-size: 18px; font-weight: bold; color: var(--vietnamese); margin-bottom: 16px; }

    .context-box {
      background: var(--sub-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; position: relative;
    }
    .context-header {
      display: flex; justify-content: space-between; align-items: center;
      color: #38bdf8; font-size: 13px; font-weight: bold; margin-bottom: 8px;
    }
    .context-zh { font-size: 17px; color: #f1f5f9; font-weight: 600; margin-bottom: 4px; }
    .context-py { font-size: 13px; color: var(--pinyin); margin-bottom: 4px; }
    .context-vi { font-size: 13px; color: var(--muted); font-style: italic; }

    .icon-audio {
      background: transparent; border: none; color: #38bdf8; font-size: 20px; cursor: pointer; padding: 4px;
    }

    /* Nút đánh giá mức độ nhớ */
    .rating-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rate-btn { padding: 12px 6px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
    .again { background: #ef4444; }
    .hard { background: #f97316; }
    .good { background: #3b82f6; }
    .easy { background: #22c55e; }

    /* Form thêm / quản lý từ */
    .form-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #cbd5e1; }
    input[type="text"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); background: var(--sub-bg);
      color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary);
      color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold;
    }
    .btn-cancel {
      width: 100%; padding: 10px; background: #475569;
      color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px;
    }

    .word-list-section { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border); }
    .word-list-title { font-size: 17px; font-weight: bold; margin-bottom: 14px; color: #a5b4fc; }
    .word-item {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .word-info { flex: 1; padding-right: 10px; }
    .word-zh { font-weight: bold; color: white; font-size: 17px; }
    .word-py { color: var(--pinyin); font-size: 13px; }
    .word-vi { color: var(--vietnamese); font-size: 14px; }
    .word-actions { display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 12px; border: none; border-radius: 6px;
      color: white; font-size: 12px; cursor: pointer; font-weight: bold;
    }
    .btn-edit { background: var(--warning); }
    .btn-delete { background: var(--danger); }
  </style>

  <!-- Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('study')">Ôn tập phản xạ</button>
    <button class="tab-btn" onclick="switchTab('add')">Thêm / Quản lý từ</button>
  </div>

  <div class="sync-status" id="syncStatus">🔄 Đang kết nối Cloud...</div>

  <div id="studyView" class="view active">
    <div id="statBox" class="stat-box">Đang tải dữ liệu...</div>

    <!-- Thanh chuyển đổi kiểu xuất hiện Flashcard -->
    <div class="mode-bar">
      <button class="mode-btn active" id="mode-mix" onclick="setStudyMode('mix')">🎲 Trộn ngẫu nhiên</button>
      <button class="mode-btn" id="mode-vi2zh" onclick="setStudyMode('vi2zh')">🇻🇳→🇹🇼 Gõ Phồn thể</button>
      <button class="mode-btn" id="mode-zh2vi" onclick="setStudyMode('zh2vi')">🇹🇼→🇻🇳 Đọc hiểu</button>
      <button class="mode-btn" id="mode-audio" onclick="setStudyMode('audio')">🎧 Nghe phản xạ</button>
    </div>

    <div id="cardContainer"></div>
  </div>

  <div id="addView" class="view">
    <div class="form-card">
      <form id="addCardForm">
        <h3 id="formTitle" style="margin-top:0;">Thêm từ / câu giao tiếp mới</h3>
        <input type="hidden" id="editCardId" value="">
        
        <div class="form-group">
          <label for="traditional">Chữ Phồn thể (繁體中文):</label>
          <input type="text" id="traditional" placeholder="vd: 實驗室電腦的硬碟滿了，怎麼辦？" required>
        </div>
        <div class="form-group">
          <label for="pinyin">Pinyin:</label>
          <input type="text" id="pinyin" placeholder="vd: Shíyànshì diànnǎo de yìngdié mǎn le, zěnme bàn?" required>
        </div>
        <div class="form-group">
          <label for="vietnamese">Nghĩa tiếng Việt:</label>
          <input type="text" id="vietnamese" placeholder="vd: Ổ cứng máy tính phòng Lab đầy rồi, làm sao bây giờ?" required>
        </div>
        <div class="form-group">
          <label for="example">Ví dụ ngữ cảnh / Câu trả lời mẫu (Phồn thể):</label>
          <textarea id="example" rows="2" placeholder="vd: 我先把舊的資料備份到雲端，再清空硬碟空間。"></textarea>
        </div>
        <div class="form-group">
          <label for="examplePinyin">Pinyin câu ví dụ (tùy chọn):</label>
          <input type="text" id="examplePinyin" placeholder="vd: Wǒ xiān bǎ jiù de zīliào bèifèn dào yúnduān...">
        </div>
        <div class="form-group">
          <label for="exampleMeaning">Nghĩa câu ví dụ (tùy chọn):</label>
          <input type="text" id="exampleMeaning" placeholder="vd: Em sao lưu dữ liệu cũ lên đám mây trước rồi dọn ổ cứng.">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Lưu vào bộ thẻ (Tự đồng bộ)</button>
        <button type="button" id="cancelEditBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Hủy sửa</button>
      </form>
    </div>

    <div class="word-list-section">
      <div class="word-list-title">📋 Danh sách thẻ đã lưu (<span id="totalWordCount">0</span>)</div>
      <div id="wordListContainer"></div>
    </div>
  </div>

  <script>
    // Cấu hình Firebase dự án tiếng Trung Đài Loan
    const firebaseConfig = {
      apiKey: "AIzaSyD2qytj3TPX4n5TXnGr-JJor9pqO_up4N4",
      authDomain: "my-taiwanese-project.firebaseapp.com",
      databaseURL: "https://my-taiwanese-project-default-rtdb.firebaseio.com",
      projectId: "my-taiwanese-project",
      storageBucket: "my-taiwanese-project.firebasestorage.app",
      messagingSenderId: "775151282069",
      appId: "1:775151282069:web:0eef220ca1916ec868f89c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const cardsRef = db.ref('taiwanese_cards');

    let cards = [];
    let currentCard = null;
    let currentCardId = null;
    let activePromptType = 'vi2zh'; // 'vi2zh' | 'zh2vi' | 'audio'
    let studyMode = 'mix'; // 'mix' | 'vi2zh' | 'zh2vi' | 'audio'
    let isAnswerShown = false;
    let userTypedAnswer = '';

    cardsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      cards = data ? Object.values(data) : [];
      document.getElementById('syncStatus').textContent = '🟢 Đã đồng bộ Cloud (Taiwan Lab Flashcards)';
      renderStudyCard();
      renderWordList();
    });

    function createCard(traditional, pinyin, vietnamese, example, examplePinyin, exampleMeaning) {
      return {
        id: Date.now(),
        traditional,
        pinyin,
        vietnamese,
        example,
        examplePinyin,
        exampleMeaning,
        dueTimestamp: Date.now()
      };
    }

    function saveCardsToCloud() {
      document.getElementById('syncStatus').textContent = '⏳ Đang lưu lên Cloud...';
      const cardsObj = {};
      cards.forEach(card => cardsObj[card.id] = card);
      cardsRef.set(cardsObj);
    }

    function getDueCards() {
      const now = Date.now();
      return cards.filter(card => {
        if (card.dueTimestamp) return card.dueTimestamp <= now;
        if (card.dueDate) return new Date(card.dueDate + 'T00:00:00').getTime() <= now;
        return true;
      }).sort((a, b) => (a.dueTimestamp || 0) - (b.dueTimestamp || 0));
    }

    function setStudyMode(mode) {
      studyMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('mode-' + mode).classList.add('active');
      currentCardId = null; // Ép chọn lại kiểu hiển thị cho thẻ hiện tại
      isAnswerShown = false;
      userTypedAnswer = '';
      renderStudyCard();
    }

    function pickPromptTypeForCard(card) {
      if (studyMode !== 'mix') return studyMode;
      // Khi ở chế độ Trộn ngẫu nhiên:
      // 50% ra Tiếng Việt bắt gõ Phồn thể, 30% ra Phồn thể đọc hiểu, 20% ra Âm thanh nghe phản xạ
      const r = Math.random();
      if (r < 0.5) return 'vi2zh';
      if (r < 0.8) return 'zh2vi';
      return 'audio';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (tab === 'study') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('studyView').classList.add('active');
        renderStudyCard();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('addView').classList.add('active');
        renderWordList();
      }
    }

    function speakTaiwanese(text, e) {
      if (e) e.stopPropagation();
      if (!text || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.92;

      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW') || v.name.includes('Taiwan'));
      if (twVoice) utterance.voice = twVoice;
      window.speechSynthesis.speak(utterance);
    }

    function updateCardSchedule(card, quality) {
      const MINUTE = 60 * 1000;
      const HOUR = 60 * MINUTE;
      const DAY = 24 * HOUR;

      let offset = 10 * MINUTE;
      if (quality === 0) offset = 10 * MINUTE;       // Quên: 10 phút
      else if (quality === 3) offset = 12 * HOUR;    // Khó: 12 tiếng
      else if (quality === 4) offset = 1 * DAY;      // Tốt: 1 ngày
      else if (quality === 5) offset = 2 * DAY;      // Dễ: 2 ngày

      card.dueTimestamp = Date.now() + offset;
      return card;
    }

    function handleRating(quality) {
      if (!currentCard) return;
      const updatedCard = updateCardSchedule(currentCard, quality);
      const index = cards.findIndex(c => c.id === currentCard.id);
      cards[index] = updatedCard;

      saveCardsToCloud();
      isAnswerShown = false;
      userTypedAnswer = '';
      currentCardId = null;
      renderStudyCard();
    }

    function normalizeText(str) {
      // Loại bỏ dấu câu phổ biến và khoảng trắng thừa để so sánh linh hoạt khi gõ câu dài
      return String(str || '')
        .toLowerCase()
        .replace(/[，。！？、,.!?；;：:"'“”‘’\s]/g, '')
        .trim();
    }

    function checkTypedAnswer() {
      const inputEl = document.getElementById('userAnswerInput');
      if (inputEl) userTypedAnswer = inputEl.value.trim();
      isAnswerShown = true;
      renderStudyCard();
      if (currentCard) {
        const targetZh = currentCard.traditional || currentCard.word || '';
        speakTaiwanese(targetZh);
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderStudyCard() {
      const dueCards = getDueCards();
      const statBox = document.getElementById('statBox');
      const container = document.getElementById('cardContainer');

      statBox.textContent = `Thẻ cần ôn hiện tại: ${dueCards.length} / Tổng số thẻ: ${cards.length}`;

      if (dueCards.length === 0) {
        container.innerHTML = `
          <div class="flashcard">
            <h3>🎉 Bạn đã hoàn thành hết các thẻ đến hạn!</h3>
            <p style="color: var(--muted);">Chuyển sang tab "Thêm / Quản lý từ" để nạp thêm từ vựng mới hoặc đợi thẻ quay lại theo lịch.</p>
          </div>
        `;
        return;
      }

      currentCard = dueCards[0];
      const zhText = currentCard.traditional || currentCard.word || '';
      const pyText = currentCard.pinyin || '';
      const viText = currentCard.vietnamese || currentCard.meaning || '';
      const exZh = currentCard.example || '';
      const exPy = currentCard.examplePinyin || '';
      const exVi = currentCard.exampleMeaning || '';

      // Khi chuyển sang thẻ mới, chọn ngẫu nhiên kiểu hiển thị (nếu ở chế độ Mix)
      if (currentCardId !== currentCard.id) {
        currentCardId = currentCard.id;
        activePromptType = pickPromptTypeForCard(currentCard);
        if (activePromptType === 'audio') {
          setTimeout(() => speakTaiwanese(zhText), 200);
        }
      }

      // Kiểm tra kết quả gõ
      const normInput = normalizeText(userTypedAnswer);
      const normZh = normalizeText(zhText);
      const normPy = normalizeText(pyText);
      const normVi = normalizeText(viText);

      let isMatch = false;
      if (normInput.length > 0) {
        if (activePromptType === 'vi2zh') {
          // Chế độ Tiếng Việt -> Phồn thể: bắt buộc khớp chữ Phồn thể
          isMatch = (normInput === normZh);
        } else {
          // Chế độ Đọc hiểu / Nghe: chấp nhận khớp Phồn thể, Pinyin hoặc Nghĩa tiếng Việt
          isMatch = (normInput === normZh || normInput === normPy || normInput === normVi);
        }
      }

      // Giao diện mặt trước thay đổi theo từng kiểu
      let frontHtml = '';
      let placeholderText = '';
      if (activePromptType === 'vi2zh') {
        frontHtml = `
          <span class="mode-badge badge-vi">🇻🇳 Phản xạ: Gõ chữ Phồn thể</span>
          <div class="front-prompt-vi">${escapeHtml(viText)}</div>
        `;
        placeholderText = 'Gõ lại bằng Chữ Phồn thể...';
      } else if (activePromptType === 'audio') {
        frontHtml = `
          <span class="mode-badge badge-audio">🎧 Nghe phản xạ (Giọng Đài Loan)</span>
          <div class="front-prompt-audio">
            <button class="big-audio-btn" onclick="speakTaiwanese('${zhText.replace(/'/g, "\\'")}', event)">🔊</button>
            <div style="font-size: 13px; color: var(--muted); margin-top: 8px;">Bấm loa để nghe lại, sau đó gõ Chữ Phồn thể hoặc Nghĩa</div>
          </div>
        `;
        placeholderText = 'Nghe được gì? Gõ Phồn thể hoặc Nghĩa...';
      } else {
        frontHtml = `
          <span class="mode-badge badge-zh">🇹🇼 Đọc hiểu: Chữ Phồn thể</span>
          <div class="front-prompt-zh">${escapeHtml(zhText)}</div>
        `;
        placeholderText = 'Gõ Pinyin hoặc Nghĩa tiếng Việt...';
      }

      container.innerHTML = `
        <div class="flashcard">
          ${frontHtml}

          <div class="input-row">
            <input 
              type="text" 
              id="userAnswerInput" 
              class="answer-input" 
              value="${escapeHtml(userTypedAnswer)}"
              placeholder="${placeholderText}" 
              autocomplete="off"
              onkeydown="if(event.key === 'Enter') { event.preventDefault(); checkTypedAnswer(); }"
            >
            <button class="btn-check" onclick="checkTypedAnswer()">Kiểm tra</button>
          </div>

          ${!isAnswerShown ? `
            <div class="flip-hint" onclick="checkTypedAnswer()">↻ Bấm vào đây để lật xem đáp án</div>
          ` : `
            ${userTypedAnswer ? `
              <div class="check-result ${isMatch ? 'check-correct' : 'check-wrong'}">
                ${isMatch 
                  ? `✅ Chính xác! Bạn đã gõ đúng: "${escapeHtml(userTypedAnswer)}"` 
                  : `❌ Chưa khớp! Bạn gõ: "${escapeHtml(userTypedAnswer)}"`
                }
              </div>
            ` : ''}

            <div class="back-details">
              <div class="field-label">Chữ Phồn thể:</div>
              <div class="val-zh">
                <span>${escapeHtml(zhText)}</span>
                <button class="icon-audio" onclick="speakTaiwanese('${zhText.replace(/'/g, "\\'")}', event)" title="Nghe phát âm Đài Loan">🔊</button>
              </div>

              <div class="field-label">Pinyin:</div>
              <div class="val-pinyin">${escapeHtml(pyText)}</div>

              <div class="field-label">Nghĩa tiếng Việt:</div>
              <div class="val-vi">(${escapeHtml(viText)})</div>

              ${exZh ? `
                <div class="context-box">
                  <div class="context-header">
                    <span>❞ Ví dụ ngữ cảnh / Câu đối đáp:</span>
                    <button class="icon-audio" onclick="speakTaiwanese('${exZh.replace(/'/g, "\\'")}', event)" title="Nghe câu ví dụ">🔊</button>
                  </div>
                  <div class="context-zh">${escapeHtml(exZh)}</div>
                  ${exPy ? `<div class="context-py">${escapeHtml(exPy)}</div>` : ''}
                  ${exVi ? `<div class="context-vi">(${escapeHtml(exVi)})</div>` : ''}
                </div>
              ` : ''}
            </div>
          `}
        </div>

        ${isAnswerShown ? `
          <div class="rating-btns">
            <button class="rate-btn again" onclick="handleRating(0)">Quên<br><small>10 phút</small></button>
            <button class="rate-btn hard" onclick="handleRating(3)">Khó<br><small>12 tiếng</small></button>
            <button class="rate-btn good" onclick="handleRating(4)">Tốt<br><small>1 ngày</small></button>
            <button class="rate-btn easy" onclick="handleRating(5)">Dễ<br><small>2 ngày</small></button>
          </div>
        ` : ''}
      `;

      if (!isAnswerShown) {
        const inputEl = document.getElementById('userAnswerInput');
        if (inputEl) inputEl.focus();
      }
    }

    function renderWordList() {
      const container = document.getElementById('wordListContainer');
      document.getElementById('totalWordCount').textContent = cards.length;

      if (cards.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:15px;">Chưa có thẻ nào trong danh sách.</div>';
        return;
      }

      const sortedCards = [...cards].reverse();
      container.innerHTML = sortedCards.map(card => `
        <div class="word-item">
          <div class="word-info">
            <div class="word-zh">${escapeHtml(card.traditional || card.word)}</div>
            <div class="word-py">${escapeHtml(card.pinyin)}</div>
            <div class="word-vi">${escapeHtml(card.vietnamese || card.meaning)}</div>
          </div>
          <div class="word-actions">
            <button class="btn-action btn-edit" onclick="editCard(${card.id})">Sửa</button>
            <button class="btn-action btn-delete" onclick="deleteCard(${card.id})">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('addCardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const traditional = document.getElementById('traditional').value.trim();
      const pinyin = document.getElementById('pinyin').value.trim();
      const vietnamese = document.getElementById('vietnamese').value.trim();
      const example = document.getElementById('example').value.trim();
      const examplePinyin = document.getElementById('examplePinyin').value.trim();
      const exampleMeaning = document.getElementById('exampleMeaning').value.trim();
      const editId = document.getElementById('editCardId').value;

      if (!traditional || !vietnamese) return;

      if (editId) {
        const index = cards.findIndex(c => c.id == editId);
        if (index !== -1) {
          cards[index].traditional = traditional;
          cards[index].pinyin = pinyin;
          cards[index].vietnamese = vietnamese;
          cards[index].example = example;
          cards[index].examplePinyin = examplePinyin;
          cards[index].exampleMeaning = exampleMeaning;
        }
      } else {
        cards.push(createCard(traditional, pinyin, vietnamese, example, examplePinyin, exampleMeaning));
      }

      saveCardsToCloud();
      resetForm();
    });

    function editCard(id) {
      const card = cards.find(c => c.id == id);
      if (!card) return;

      document.getElementById('editCardId').value = card.id;
      document.getElementById('traditional').value = card.traditional || card.word || '';
      document.getElementById('pinyin').value = card.pinyin || '';
      document.getElementById('vietnamese').value = card.vietnamese || card.meaning || '';
      document.getElementById('example').value = card.example || '';
      document.getElementById('examplePinyin').value = card.examplePinyin || '';
      document.getElementById('exampleMeaning').value = card.exampleMeaning || '';

      document.getElementById('formTitle').textContent = 'Chỉnh sửa thẻ';
      document.getElementById('submitBtn').textContent = 'Lưu thay đổi';
      document.getElementById('cancelEditBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCard(id) {
      if (confirm('Bạn có chắc chắn muốn xóa thẻ này?')) {
        cards = cards.filter(c => c.id != id);
        saveCardsToCloud();
      }
    }

    function resetForm() {
      document.getElementById('editCardId').value = '';
      document.getElementById('traditional').value = '';
      document.getElementById('pinyin').value = '';
      document.getElementById('vietnamese').value = '';
      document.getElementById('example').value = '';
      document.getElementById('examplePinyin').value = '';
      document.getElementById('exampleMeaning').value = '';

      document.getElementById('formTitle').textContent = 'Thêm từ / câu giao tiếp mới';
      document.getElementById('submitBtn').textContent = 'Lưu vào bộ thẻ (Tự đồng bộ)';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }
  </script>
</body>
</html>
