<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Taiwanese Chinese - Phản Xạ Phòng Lab (Offline & Cloud)</title>
  <style>
    :root {
      --bg: #181c24;
      --card-bg: #222733;
      --sub-bg: #1b202b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --pinyin: #facc15;
      --vietnamese: #22c55e;
      --border: #334155;
      --danger: #ef4444;
      --warning: #d97706;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 660px;
      margin: 0 auto;
      padding: 20px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    button.tab-btn {
      flex: 1; padding: 12px 8px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--muted); cursor: pointer;
      border-radius: 10px; font-weight: bold; font-size: 14px; transition: all 0.2s;
    }
    button.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .view { display: none; }
    .view.active { display: block; }

    .sync-status {
      font-size: 13px; text-align: center; margin-bottom: 12px; font-weight: 600; color: var(--muted);
    }
    .stat-box {
      text-align: center; padding: 10px; background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px; margin-bottom: 14px; font-weight: bold; color: #a5b4fc; font-size: 14px;
    }

    .mode-bar { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .mode-btn {
      flex: 1; min-width: 115px; padding: 8px 8px; font-size: 12px; font-weight: bold;
      border-radius: 8px; border: 1px solid var(--border); background: var(--sub-bg);
      color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active { background: #312e81; color: #e0e7ff; border-color: var(--primary); }

    .flashcard {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 22px; text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      margin-bottom: 18px;
    }
    .mode-badge {
      display: inline-block; font-size: 11px; font-weight: bold; padding: 4px 10px;
      border-radius: 999px; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-zh { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
    .badge-vi { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-audio { background: rgba(250, 204, 21, 0.2); color: #fde047; border: 1px solid rgba(250, 204, 21, 0.4); }

    .front-prompt-zh { font-size: 32px; font-weight: bold; color: #ffffff; margin-bottom: 18px; line-height: 1.4; }
    .front-prompt-vi { font-size: 22px; font-weight: bold; color: var(--vietnamese); margin-bottom: 18px; line-height: 1.5; }
    .front-prompt-audio { margin-bottom: 18px; }
    .big-audio-btn {
      background: #312e81; border: 2px solid var(--primary); color: white;
      border-radius: 50%; width: 64px; height: 64px; font-size: 28px; cursor: pointer;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .answer-input {
      flex: 1; padding: 12px 16px; font-size: 16px; background: var(--sub-bg);
      color: white; border: 1px solid var(--border); border-radius: 10px; outline: none;
    }
    .answer-input:focus { border-color: var(--primary); }
    .btn-check {
      padding: 12px 20px; background: var(--primary); color: white; border: none;
      border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;
    }

    .flip-hint { font-size: 13px; color: var(--muted); cursor: pointer; margin-top: 6px; display: inline-block; }
    .flip-hint:hover { color: white; }

    .compare-box {
      padding: 12px 14px; border-radius: 10px; margin: 14px 0; font-size: 14px; text-align: left; line-height: 1.6;
    }
    .compare-pass { background: rgba(34, 197, 94, 0.14); border: 1px solid rgba(34, 197, 94, 0.45); color: #dcfce7; }
    .compare-partial { background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(245, 158, 11, 0.45); color: #fef3c7; }
    .compare-fail { background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.45); color: #fee2e2; }
    .compare-title { font-weight: bold; font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .compare-line { font-size: 13px; margin-top: 4px; color: #cbd5e1; }
    .tok-hit { color: #4ade80; font-weight: bold; background: rgba(34, 197, 94, 0.18); padding: 1px 3px; border-radius: 4px; }
    .tok-miss { color: #facc15; border-bottom: 1px dashed #facc15; padding: 0 2px; }
    .tok-stop { color: #94a3b8; }

    .back-details { text-align: left; border-top: 1px solid var(--border); padding-top: 18px; margin-top: 16px; }
    .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .val-zh { font-size: 26px; font-weight: bold; color: #ffffff; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .val-pinyin { font-size: 18px; font-weight: bold; color: var(--pinyin); margin-bottom: 14px; }
    .val-vi { font-size: 18px; font-weight: bold; color: var(--vietnamese); margin-bottom: 16px; }

    .context-box {
      background: var(--sub-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    }
    .context-header {
      display: flex; justify-content: space-between; align-items: center;
      color: #38bdf8; font-size: 13px; font-weight: bold; margin-bottom: 8px;
    }
    .context-zh { font-size: 17px; color: #f1f5f9; font-weight: 600; line-height: 1.5; }

    .icon-audio { background: transparent; border: none; color: #38bdf8; font-size: 20px; cursor: pointer; padding: 4px; }

    .rating-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .rate-btn { padding: 12px 6px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
    .again { background: #ef4444; }
    .hard { background: #f97316; }
    .good { background: #3b82f6; }
    .easy { background: #22c55e; }

    .form-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #cbd5e1; }
    input[type="text"], textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); background: var(--sub-bg);
      color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px;
    }
    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary);
      color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: bold;
    }
    .btn-cancel {
      width: 100%; padding: 10px; background: #475569;
      color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px;
    }
    .word-list-section { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .word-list-title { font-size: 17px; font-weight: bold; margin-bottom: 14px; color: #a5b4fc; }
    .word-item {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .word-info { flex: 1; padding-right: 10px; }
    .word-zh { font-weight: bold; color: white; font-size: 17px; }
    .word-py { color: var(--pinyin); font-size: 13px; }
    .word-vi { color: var(--vietnamese); font-size: 14px; }
    .word-actions { display: flex; gap: 6px; }
    .btn-action { padding: 6px 12px; border: none; border-radius: 6px; color: white; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-edit { background: var(--warning); }
    .btn-delete { background: var(--danger); }

    .dialog-controls {
      display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
    }
    .btn-pill {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text); font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-pill.active { background: #059669; border-color: #10b981; color: white; }
    .btn-pill-primary { background: var(--primary); border-color: var(--primary); color: white; }

    .chat-box {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 14px;
    }
    .chat-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 4px;
    }
    .chat-title { font-weight: bold; font-size: 16px; color: #a5b4fc; }

    .bubble-row { display: flex; flex-direction: column; max-width: 92%; }
    .bubble-prof { align-self: flex-start; }
    .bubble-you { align-self: flex-end; }

    .speaker-tag { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: var(--muted); }
    .bubble-you .speaker-tag { text-align: right; color: #38bdf8; }

    .bubble {
      padding: 12px 14px; border-radius: 14px; position: relative; line-height: 1.5;
    }
    .bubble-prof .bubble {
      background: var(--sub-bg); border: 1px solid var(--border); border-top-left-radius: 4px;
    }
    .bubble-you .bubble {
      background: rgba(99, 102, 241, 0.18); border: 1px solid rgba(99, 102, 241, 0.45); border-top-right-radius: 4px;
    }

    .b-zh { font-size: 17px; font-weight: bold; color: #ffffff; margin-bottom: 4px; }
    .b-py { font-size: 13px; color: var(--pinyin); margin-bottom: 4px; }
    .b-vi { font-size: 13px; color: #cbd5e1; font-style: italic; }

    .roleplay-mask {
      background: rgba(15, 23, 42, 0.7); border: 1px dashed #6366f1; border-radius: 10px;
      padding: 10px; margin-top: 8px;
    }
    .roleplay-input-row { display: flex; gap: 6px; margin-top: 6px; }
    .roleplay-input {
      flex: 1; padding: 9px 11px; font-size: 14px; background: var(--bg);
      color: white; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box;
    }
    .btn-reveal-turn {
      margin-top: 8px; padding: 6px 12px; font-size: 12px; background: var(--primary);
      color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .progress-hint {
      text-align: center; font-size: 12px; color: var(--muted); padding-top: 6px; border-top: 1px dashed var(--border);
    }
  </style>

  <!-- Firebase App & Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('study')">Ôn tập thẻ</button>
    <button class="tab-btn" onclick="switchTab('dialogue')">💬 Luyện Hội Thoại</button>
    <button class="tab-btn" onclick="switchTab('add')">Thêm / Quản lý</button>
  </div>

  <div class="sync-status" id="syncStatus">🔄 Đang khởi tạo dữ liệu Offline & Cloud...</div>

  <!-- ================= TAB 1: ÔN TẬP THẺ ================= -->
  <div id="studyView" class="view active">
    <div id="statBox" class="stat-box">Đang tải dữ liệu...</div>

    <div class="mode-bar">
      <button class="mode-btn active" id="mode-mix" onclick="setStudyMode('mix')">🎲 Trộn ngẫu nhiên</button>
      <button class="mode-btn" id="mode-vi2zh" onclick="setStudyMode('vi2zh')">🇻🇳→🇹🇼 Gõ Phồn thể</button>
      <button class="mode-btn" id="mode-zh2vi" onclick="setStudyMode('zh2vi')">🇹🇼→🇻🇳 Đọc hiểu</button>
      <button class="mode-btn" id="mode-audio" onclick="setStudyMode('audio')">🎧 Nghe phản xạ</button>
    </div>

    <div id="cardContainer"></div>
  </div>

  <!-- ================= TAB 2: LUYỆN HỘI THOẠI TỪNG BƯỚC ================= -->
  <div id="dialogueView" class="view">
    <div class="dialog-controls">
      <select id="dialogueSelect" onchange="selectDialogue(this.value)" style="flex:1; min-width: 180px;"></select>
      <button class="btn-pill" id="roleplayToggleBtn" onclick="toggleRoleplayMode()">🎭 Đóng vai: TẮT</button>
      <button class="btn-pill btn-pill-primary" onclick="playFullDialogue()">🔊 Nghe cả đoạn</button>
    </div>

    <div id="dialogueContainer"></div>

    <div class="form-card">
      <h4 style="margin-top:0; color:#a5b4fc;">➕ Thêm đoạn hội thoại mới (Dán trực tiếp từ bài học)</h4>
      <div class="form-group">
        <label for="dialogTitle">Tên chủ đề hội thoại:</label>
        <input type="text" id="dialogTitle" placeholder="vd: Ngày 2 - Báo cáo lỗi phần mềm với Giáo sư">
      </div>
      <div class="form-group">
        <label for="dialogRawText">Dán nội dung hội thoại (giữ định dạng "- Bạn: ..." và "- Giáo sư: ..."):</label>
        <textarea id="dialogRawText" rows="6" placeholder="- Bạn: 老師，剛才我在執行程式的時候，系統一直報錯。Lǎoshī, gāngcái wǒ zài zhíxíng chéngshì de shíhòu, xìtǒng yīzhí bàocuò.(Thưa thầy, vừa nãy lúc em chạy chương trình thì hệ thống cứ báo lỗi liên tục ạ.)
- Giáo sư: 是什麼錯誤？你有先檢查一下嗎？Shì shénme cuòwù? Nǐ yǒu xiān jiǎnchá yīxià ma?(Lỗi gì vậy? Em đã kiểm tra qua trước chưa?)"></textarea>
      </div>
      <button type="button" class="btn-submit" onclick="saveParsedDialogue()">Lưu hội thoại (Offline & Cloud)</button>
    </div>
  </div>

  <!-- ================= TAB 3: THÊM / QUẢN LÝ TỪ VỰNG ================= -->
  <div id="addView" class="view">
    <div class="form-card">
      <form id="addCardForm">
        <h3 id="formTitle" style="margin-top:0;">Thêm từ vựng mới</h3>
        <input type="hidden" id="editCardId" value="">
        
        <div class="form-group">
          <label for="traditional">Chữ Phồn thể:</label>
          <input type="text" id="traditional" placeholder="vd: 電腦" required>
        </div>
        <div class="form-group">
          <label for="pinyin">Pinyin:</label>
          <input type="text" id="pinyin" placeholder="vd: diànnǎo" required>
        </div>
        <div class="form-group">
          <label for="vietnamese">Nghĩa tiếng Việt:</label>
          <input type="text" id="vietnamese" placeholder="vd: Máy tính" required>
        </div>
        <div class="form-group">
          <label for="example">Ví dụ ngữ cảnh (Chỉ cần dán chữ Phồn thể):</label>
          <textarea id="example" rows="2" placeholder="vd: 請教授看一下我的螢幕"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Lưu vào bộ thẻ (Offline & Cloud)</button>
        <button type="button" id="cancelEditBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Hủy sửa</button>
      </form>
    </div>

    <div class="word-list-section">
      <div class="word-list-title">📋 Danh sách từ đã lưu (<span id="totalWordCount">0</span>)</div>
      <div id="wordListContainer"></div>
    </div>
  </div>

  <script>
    // ================= 1. CẤU HÌNH LOCAL STORAGE & OFFLINE SYNC =================
    const LS_CARDS_KEY = 'tw_anki_cards_cache_v1';
    const LS_NODE_KEY = 'tw_anki_detected_node_v1';
    const LS_DIALOGUES_KEY = 'tw_anki_dialogues_cache_v1';
    const LS_PENDING_CARDS_SYNC = 'tw_anki_pending_cards_sync_v1';
    const LS_DELETED_CARD_IDS = 'tw_anki_deleted_card_ids_v1';
    const LS_PENDING_DIALOGUES_SYNC = 'tw_anki_pending_dialogues_sync_v1';

    let detectedCardNode = localStorage.getItem(LS_NODE_KEY) || 'anki_cards';
    let cards = [];
    let currentCard = null;
    let currentCardId = null;
    let activePromptType = 'vi2zh';
    let studyMode = 'mix';
    let isAnswerShown = false;
    let userTypedAnswer = '';

    const defaultDialogue = {
      id: 1700000000002,
      title: "Ngày 2 - Báo cáo lỗi phần mềm với Giáo sư",
      turns: [
        {
          speaker: "Bạn",
          zh: "老師，剛才我在執行程式的時候，系統一直報錯。",
          pinyin: "Lǎoshī, gāngcái wǒ zài zhíxíng chéngshì de shíhòu, xìtǒng yīzhí bàocuò.",
          vi: "Thưa thầy, vừa nãy lúc em chạy chương trình thì hệ thống cứ báo lỗi liên tục ạ."
        },
        {
          speaker: "Giáo sư",
          zh: "是什麼錯誤？你有先檢查一下嗎？",
          pinyin: "Shì shénme cuòwù? Nǐ yǒu xiān jiǎnchá yīxià ma?",
          vi: "Lỗi gì vậy? Em đã kiểm tra qua trước chưa?"
        },
        {
          speaker: "Bạn",
          zh: "應該是版本不相容，而且顯示卡的記憶體也不足。我重新開機過了，但還是不行。",
          pinyin: "Yīnggāi shì bǎnběn bù xiāngróng, érqiě xiǎnshìkǎ de jìyìtǐ yě bùzú. Wǒ chóngxīn kāijī guò le, dàn háishì bùxíng.",
          vi: "Chắc là do phiên bản không tương thích, với lại bộ nhớ card màn hình cũng không đủ ạ. Em đã khởi động lại máy rồi nhưng vẫn không được."
        },
        {
          speaker: "Giáo sư",
          zh: "好，你把錯誤畫面截圖寄給我，順便把資料先備份起來。",
          pinyin: "Hǎo, nǐ bǎ cuòwù huàmiàn jiétú jì gěi wǒ, shùnbiàn bǎ zīliào xiān bèifèn qǐlái.",
          vi: "Được, em chụp màn hình chỗ báo lỗi gửi cho thầy, tiện thể sao lưu dữ liệu trước đi nhé."
        },
        {
          speaker: "Bạn",
          zh: "好的，我馬上處理，也會順便更新一下套件。",
          pinyin: "Hǎo de, wǒ mǎshàng chǔlǐ, yě huì shùnbiàn gēngxīn yīxià tàojiàn.",
          vi: "Dạ vâng, em xử lý ngay đây ạ, em cũng sẽ tiện thể cập nhật lại các gói thư viện luôn."
        }
      ]
    };

    let dialogues = [defaultDialogue];
    let selectedDialogueId = defaultDialogue.id;
    let isRoleplayMode = false;
    let revealedTurns = {};
    let turnTypedAnswers = {};

    // Nạp ngay dữ liệu từ máy (LocalStorage) trước khi kết nối mạng -> Mở web Offline dùng được ngay 0ms
    function loadFromLocalCache() {
      try {
        const cachedCards = localStorage.getItem(LS_CARDS_KEY);
        if (cachedCards) {
          cards = JSON.parse(cachedCards) || [];
        }
        const cachedDialogues = localStorage.getItem(LS_DIALOGUES_KEY);
        if (cachedDialogues) {
          const parsedD = JSON.parse(cachedDialogues);
          if (Array.isArray(parsedD) && parsedD.length > 0) {
            dialogues = parsedD;
            selectedDialogueId = dialogues[0].id;
          }
        }
      } catch (e) {
        console.warn('Lỗi đọc cache cục bộ:', e);
      }
      updateSyncStatusBanner();
      renderStudyCard();
      renderWordList();
      renderDialogueSelector();
      renderDialogueView();
    }

    function saveToLocalCache() {
      try {
        localStorage.setItem(LS_CARDS_KEY, JSON.stringify(cards));
        localStorage.setItem(LS_NODE_KEY, detectedCardNode);
        localStorage.setItem(LS_DIALOGUES_KEY, JSON.stringify(dialogues));
      } catch (e) {
        console.warn('Lỗi lưu cache cục bộ:', e);
      }
    }

    function updateSyncStatusBanner(extraMsg) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      const isOnline = navigator.onLine;
      const hasPending = localStorage.getItem(LS_PENDING_CARDS_SYNC) === '1' || localStorage.getItem(LS_PENDING_DIALOGUES_SYNC) === '1';

      if (!isOnline) {
        el.innerHTML = `📴 <strong>Chế độ Offline</strong> — Đang dùng dữ liệu lưu trên máy (${cards.length} thẻ)${hasPending ? ' • Có thay đổi chờ đồng bộ' : ''}`;
        el.style.color = '#facc15';
      } else if (extraMsg) {
        el.textContent = extraMsg;
        el.style.color = '#86efac';
      } else {
        el.textContent = `🟢 Đã đồng bộ Cloud & Lưu Offline (${cards.length} thẻ • nhánh: ${detectedCardNode})`;

    function normalizeLoadedCard(rawItem, fallbackKey) {
      if (!rawItem || typeof rawItem !== 'object') return null;
      const zh = rawItem.traditional || rawItem.hanzi || rawItem.chinese || rawItem.word || rawItem.zh || rawItem.front;
      const vi = rawItem.vietnamese || rawItem.meaning || rawItem.vi || rawItem.back;
      if (!zh && !vi) return null;

      return {
        ...rawItem,
        id: rawItem.id || fallbackKey || Date.now(),
        traditional: zh || '',
        pinyin: rawItem.pinyin || rawItem.py || '',
        vietnamese: vi || '',
        example: rawItem.example || rawItem.context || ''
      };
    }

    function flushPendingOfflineChanges() {
      if (!db || !navigator.onLine) return;

      // Đồng bộ thẻ từ vựng thay đổi lúc offline
      if (localStorage.getItem(LS_PENDING_CARDS_SYNC) === '1') {
        const deletedIds = JSON.parse(localStorage.getItem(LS_DELETED_CARD_IDS) || '[]');
        deletedIds.forEach(delId => {
          const delRef = (detectedCardNode === '/') ? db.ref('/' + delId) : db.ref(detectedCardNode + '/' + delId);
          delRef.remove();
        });

        const cardsObj = {};
        cards.forEach(card => cardsObj[card.id] = card);
        const targetRef = (detectedCardNode === '/') ? db.ref('/') : db.ref(detectedCardNode);
        targetRef.update(cardsObj).then(() => {
          localStorage.removeItem(LS_PENDING_CARDS_SYNC);
          localStorage.removeItem(LS_DELETED_CARD_IDS);
          updateSyncStatusBanner(`🟢 Đã đồng bộ dữ liệu Offline lên Cloud (${cards.length} thẻ)`);
        });
      }

      // Đồng bộ hội thoại thay đổi lúc offline
      if (localStorage.getItem(LS_PENDING_DIALOGUES_SYNC) === '1') {
        const obj = {};
        dialogues.forEach(d => obj[d.id] = d);
        dialoguesRef.set(obj).then(() => {
          localStorage.removeItem(LS_PENDING_DIALOGUES_SYNC);
        });
      }
    }

    if (rootRef) {
      rootRef.on('value', (snapshot) => {
        // Nếu đang có thay đổi offline chưa đẩy lên thì đẩy lên trước, không để cloud đè mất tiến độ offline
        if (localStorage.getItem(LS_PENDING_CARDS_SYNC) === '1') {
          flushPendingOfflineChanges();
          return;
        }

        const rootData = snapshot.val();
        let foundCards = [];

        if (rootData && typeof rootData === 'object') {
          Object.keys(rootData).forEach((key) => {
            if (key === 'taiwanese_dialogues') return;

            const branch = rootData[key];
            if (branch && typeof branch === 'object') {
              const directCard = normalizeLoadedCard(branch, key);
              if (directCard && (branch.pinyin || branch.traditional || branch.hanzi || branch.word)) {
                foundCards.push(directCard);

              } else {
                const subItems = Object.entries(branch)
                  .map(([subKey, val]) => normalizeLoadedCard(val, subKey))

    // Lọc lấy riêng phần chữ Hán Phồn thể (loại bỏ Pinyin Latin cũ nếu có)
   function extractHanziOnly(text) {
  if (!text) return '';
  // Chỉ giữ lại chữ Hán Phồn thể và dấu câu tiếng Trung, loại bỏ hoàn toàn cả tiếng Việt có dấu lẫn Pinyin
  const matches = String(text).match(/[\u4e00-\u9fff\u3400-\u4dbf，。！？、；：「」『』（）…—·]+/g);
  return matches ? matches.join(' ').trim() : '';
}

    function speakTaiwanese(text, e, onEndCallback) {
      if (e) e.stopPropagation();
      if (!text || !('speechSynthesis' in window)) return;

      const hanziClean = extractHanziOnly(text) || String(text).trim();

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(hanziClean);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.92;

      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang === 'zh-TW' || v.lang.includes('TW') || v.name.includes('Taiwan'));
      if (twVoice) utterance.voice = twVoice;
      if (onEndCallback) utterance.onend = onEndCallback;
      window.speechSynthesis.speak(utterance);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ================= 3. CHẤM ĐIỂM THEO Ý CHÍNH & TỪ KHÓA CỐT LÕI =================
    const ZH_STOP_WORDS = new Set([
      '的', '了', '啊', '吧', '嗎', '呢', '喔', '呀', '哦', '啦', '嘛',
      '就', '也', '還', '都', '很', '太', '真', '好', '在', '是', '有',
      '我', '你', '您', '他', '她', '們', '這', '那', '個', '些', '把', '被',
      '一', '下', '過', '著', '起', '來', '去', '到', '給', '跟', '和', '與',
      '老', '師', '教', '授', '請', '問', '謝'
    ]);

    function evaluateFlexibleChinese(userInput, targetSample) {
      const cleanUser = String(userInput || '').replace(/[，。！？、,.!?；;：:"'“”‘’\s]/g, '').trim();
      const cleanTarget = String(targetSample || '').replace(/[，。！？、,.!?；;：:"'“”‘’\s]/g, '').trim();

      if (!cleanUser) return null;

      const targetChars = Array.from(cleanTarget);
      const userCharSet = new Set(Array.from(cleanUser));

      let coreTotal = 0;
      let coreMatched = 0;
      let highlightedSampleHtml = '';

      targetChars.forEach(ch => {
        const isStop = ZH_STOP_WORDS.has(ch);
        if (isStop) {
          highlightedSampleHtml += userCharSet.has(ch)
            ? `<span class="tok-hit">${escapeHtml(ch)}</span>`
            : `<span class="tok-stop">${escapeHtml(ch)}</span>`;
        } else {
          coreTotal++;
          if (userCharSet.has(ch)) {
            coreMatched++;
            highlightedSampleHtml += `<span class="tok-hit">${escapeHtml(ch)}</span>`;
          } else {
            highlightedSampleHtml += `<span class="tok-miss">${escapeHtml(ch)}</span>`;
          }
        }
      });

      if (coreTotal === 0) {
        coreTotal = targetChars.length;
        coreMatched = targetChars.filter(ch => userCharSet.has(ch)).length;
      }

      const ratio = coreTotal > 0 ? (coreMatched / coreTotal) : 0;
      const percent = Math.round(ratio * 100);

      let status = 'fail';
      if (cleanUser === cleanTarget || percent >= 60) {
        status = 'pass';
      } else if (percent >= 30) {
        status = 'partial';
      }

      return {
        status,
        percent,
        userRaw: userInput,
        highlightedSampleHtml
      };
    }

    function renderComparisonHtml(evalRes) {
      if (!evalRes) return '';
      let boxClass = 'compare-fail';
      let titleText = `❌ Chưa sát ý chính (${evalRes.percent}% từ khóa)`;
      if (evalRes.status === 'pass') {
        boxClass = 'compare-pass';
        titleText = `✅ Đạt ý & Đúng từ vựng chuẩn! (${evalRes.percent}% từ khóa cốt lõi)`;
      } else if (evalRes.status === 'partial') {
        boxClass = 'compare-partial';
        titleText = `⚠️ Đúng một phần ý (${evalRes.percent}% từ khóa cốt lõi)`;
      }

      return `
        <div class="compare-box ${boxClass}">
          <div class="compare-title"><span>${titleText}</span></div>
          <div class="compare-line"><strong>Bạn gõ:</strong> ${escapeHtml(evalRes.userRaw)}</div>
          <div class="compare-line"><strong>Đáp án mẫu:</strong> ${evalRes.highlightedSampleHtml}</div>
          <div style="font-size: 11px; color: var(--muted); margin-top: 5px;">
            *Chú thích: <span class="tok-hit">Xanh</span> = từ khóa đã dùng đúng | <span class="tok-miss">Vàng gạch chân</span> = từ khóa mẫu gợi ý thêm | Xám = từ đệm có thể lược bớt.
          </div>
        </div>
      `;
    }

    function updateCardSchedule(card, quality) {
      const MINUTE = 60 * 1000;
      const HOUR = 60 * MINUTE;
      const DAY = 24 * HOUR;

      let offset = 10 * MINUTE;
      if (quality === 0) offset = 10 * MINUTE;
      else if (quality === 3) offset = 12 * HOUR;
      else if (quality === 4) offset = 1 * DAY;
      else if (quality === 5) offset = 2 * DAY;

      card.dueTimestamp = Date.now() + offset;
      return card;
    }

    function submitTurnAnswer(idx) {
      const inputEl = document.getElementById(`turn-input-${idx}`);
      if (inputEl) {
        turnTypedAnswers[idx] = inputEl.value.trim();
      }
      revealTurn(idx);
    }

    function revealTurn(idx) {
      revealedTurns[idx] = true;
      renderDialogueView();

      const dialog = dialogues.find(d => d.id == selectedDialogueId);
      if (!dialog || !dialog.turns[idx]) return;

      const currentTurn = dialog.turns[idx];
      const nextTurn = dialog.turns[idx + 1];

      speakTaiwanese(currentTurn.zh, null, () => {
        if (nextTurn && !(nextTurn.speaker.toLowerCase().includes('bạn') || nextTurn.speaker.toLowerCase().includes('em'))) {
          setTimeout(() => speakTaiwanese(nextTurn.zh), 600);
        }
      });
    }

    function playFullDialogue() {
      const dialog = dialogues.find(d => d.id == selectedDialogueId);
      if (!dialog || !dialog.turns.length) return;
      let i = 0;
      function playNext() {
        if (i >= dialog.turns.length) return;
        const turn = dialog.turns[i];
        i++;
        speakTaiwanese(turn.zh, null, () => {
          setTimeout(playNext, 500);
        });
      }
      playNext();
    }

    function deleteCurrentDialogue() {
      if (dialogues.length <= 1) {
        alert('Cần giữ lại ít nhất 1 đoạn hội thoại mẫu.');
        return;
      }
      if (confirm('Xóa đoạn hội thoại này?')) {
        dialogues = dialogues.filter(d => d.id != selectedDialogueId);
        selectedDialogueId = dialogues[0].id;
        saveDialoguesToCloud();
      }
    }

    function renderDialogueView() {
      const container = document.getElementById('dialogueContainer');
      const dialog = dialogues.find(d => d.id == selectedDialogueId) || dialogues[0];
      if (!dialog) return;

      let visibleLimit = dialog.turns.length - 1;
      if (isRoleplayMode) {
        for (let i = 0; i < dialog.turns.length; i++) {
          const isYouTurn = dialog.turns[i].speaker.toLowerCase().includes('bạn') || dialog.turns[i].speaker.toLowerCase().includes('em');
          if (isYouTurn && !revealedTurns[i]) {
            visibleLimit = i;
            break;
          }
        }
      }

      const visibleTurns = dialog.turns.slice(0, visibleLimit + 1);

      const turnsHtml = visibleTurns.map((turn, idx) => {
        const isYou = turn.speaker.toLowerCase().includes('bạn') || turn.speaker.toLowerCase().includes('em');
        const shouldHide = isRoleplayMode && isYou && !revealedTurns[idx];

        let turnCompareHtml = '';
        if (isYou && revealedTurns[idx] && turnTypedAnswers[idx]) {
          const evalRes = evaluateFlexibleChinese(turnTypedAnswers[idx], turn.zh);
          turnCompareHtml = renderComparisonHtml(evalRes);
        }

        return `
          <div class="bubble-row ${isYou ? 'bubble-you' : 'bubble-prof'}">
            <div class="speaker-tag">${isYou ? '🧑‍💻 Bạn (Sinh viên)' : '👨‍🏫 Giáo sư Đài Loan'}</div>
            <div class="bubble">
              ${shouldHide ? `
                <div class="b-vi" style="color: #86efac; font-style: normal; font-weight: bold;">
                  🇻🇳 Gợi ý dàn ý: "${escapeHtml(turn.vi)}"
                </div>
                <div class="roleplay-mask">
                  <div style="font-size: 12px; color: var(--muted);">Gõ ý chính bằng Chữ Phồn thể (không cần đúng 100% từng chữ):</div>
                  <div class="roleplay-input-row">
                    <input 
                      type="text" 
                      id="turn-input-${idx}"
                      class="roleplay-input" 
                      placeholder="vd: 老師，執行程式一直報錯..." 
                      onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitTurnAnswer(${idx}); }"
                    >
                    <button class="btn-check" style="padding: 8px 14px; font-size: 13px;" onclick="submitTurnAnswer(${idx})">Kiểm tra</button>
                  </div>
                  <button class="btn-reveal-turn" onclick="revealTurn(${idx})">👁️ Bỏ qua & Hiện đáp án</button>
                </div>
              ` : `
                ${turnCompareHtml}
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                  <div class="b-zh">${escapeHtml(turn.zh)}</div>
                  <button class="icon-audio" data-speak="${escapeHtml(turn.zh)}" onclick="speakTaiwanese(this.dataset.speak, event)" title="Nghe câu này">🔊</button>
                </div>
                ${turn.pinyin ? `<div class="b-py">${escapeHtml(turn.pinyin)}</div>` : ''}
                ${turn.vi ? `<div class="b-vi">(${escapeHtml(turn.vi)})</div>` : ''}
              `}
            </div>
          </div>
        `;
      }).join('');

      const remainingCount = dialog.turns.length - visibleTurns.length;
      const footerHtml = isRoleplayMode ? (
        remainingCount > 0
          ? `<div class="progress-hint">⏳ Hoàn thành lượt trên để mở tiếp ${remainingCount} lượt hội thoại phía sau...</div>`
          : `<div class="progress-hint" style="color:#86efac;">🎉 Đã hoàn thành toàn bộ đoạn hội thoại! <button class="btn-reveal-turn" style="margin-left:8px;" onclick="revealedTurns={}; turnTypedAnswers={}; renderDialogueView();">🔄 Luyện lại từ đầu</button></div>`
      ) : '';

      container.innerHTML = `
        <div class="chat-box">
          <div class="chat-header">
            <div class="chat-title">${escapeHtml(dialog.title)}</div>
            <button class="btn-action btn-delete" onclick="deleteCurrentDialogue()">Xóa bài này</button>
          </div>
          ${turnsHtml}
          ${footerHtml}
        </div>
      `;

      if (isRoleplayMode) {
        const activeInput = document.getElementById(`turn-input-${visibleLimit}`);
        if (activeInput) activeInput.focus();
      }
    }

    function saveParsedDialogue() {
      const title = document.getElementById('dialogTitle').value.trim() || ('Hội thoại ' + new Date().toLocaleDateString());
      const raw = document.getElementById('dialogRawText').value.trim();
      if (!raw) return;

      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      const turns = [];

      lines.forEach(line => {
        const match = line.match(/^-?\s*(Bạn|Giáo sư|Thầy|Em)\s*:\s*(.+)$/i);
        if (match) {
          const speaker = match[1];
          let rest = match[2].trim();

          let vi = '';
          const viMatch = rest.match(/\(([^()]+)\)\s*$/);
          if (viMatch) {
            vi = viMatch[1].trim();
            rest = rest.slice(0, viMatch.index).trim();
          }

          let zh = rest;
          let pinyin = '';
          const zhEndMatch = rest.match(/^(.*[。！？!?])/);
          if (zhEndMatch) {
            zh = zhEndMatch[1].trim();
            pinyin = rest.slice(zh.length).trim();
          }

          turns.push({ speaker, zh, pinyin, vi });
        }
      });

      if (turns.length === 0) {
        alert('Không nhận diện được câu thoại. Hãy đảm bảo mỗi dòng bắt đầu bằng "- Bạn:" hoặc "- Giáo sư:" nhé!');
        return;
      }

      const newDialog = {
        id: Date.now(),
        title,
        turns
      };

      dialogues.push(newDialog);
      selectedDialogueId = newDialog.id;
      revealedTurns = {};
      turnTypedAnswers = {};
      saveDialoguesToCloud();

      document.getElementById('dialogTitle').value = '';
      document.getElementById('dialogRawText').value = '';
      alert('Đã lưu đoạn hội thoại thành công!');
    }

    // ================= 6. TAB 3: QUẢN LÝ TỪ VỰNG =================
    function renderWordList() {
      const container = document.getElementById('wordListContainer');
      document.getElementById('totalWordCount').textContent = cards.length;

      if (cards.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:15px;">Chưa có từ vựng nào trong danh sách.</div>';
        return;
      }

      const sortedCards = [...cards].reverse();
      container.innerHTML = sortedCards.map(card => `
        <div class="word-item">
          <div class="word-info">
            <div class="word-zh">${escapeHtml(card.traditional || card.word)}</div>
            <div class="word-py">${escapeHtml(card.pinyin)}</div>
            <div class="word-vi">${escapeHtml(card.vietnamese || card.meaning)}</div>
          </div>
          <div class="word-actions">
            <button class="btn-action btn-edit" onclick="editCard(${card.id})">Sửa</button>
            <button class="btn-action btn-delete" onclick="deleteCard(${card.id})">Xóa</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('addCardForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const traditional = document.getElementById('traditional').value.trim();
      const pinyin = document.getElementById('pinyin').value.trim();
      const vietnamese = document.getElementById('vietnamese').value.trim();
      const example = document.getElementById('example').value.trim();
      const editId = document.getElementById('editCardId').value;

      if (!traditional || !vietnamese) return;

      if (editId) {
        const index = cards.findIndex(c => c.id == editId);
        if (index !== -1) {
          cards[index].traditional = traditional;
          cards[index].pinyin = pinyin;
          cards[index].vietnamese = vietnamese;
          cards[index].example = example;
        }
      } else {
        cards.push(createCard(traditional, pinyin, vietnamese, example));
      }

      saveCardsToCloud();
      resetForm();
    });

    function editCard(id) {
      const card = cards.find(c => c.id == id);
      if (!card) return;

      document.getElementById('editCardId').value = card.id;
      document.getElementById('traditional').value = card.traditional || card.word || '';
      document.getElementById('pinyin').value = card.pinyin || '';
      document.getElementById('vietnamese').value = card.vietnamese || card.meaning || '';
      document.getElementById('example').value = card.example || '';

      document.getElementById('formTitle').textContent = 'Chỉnh sửa từ vựng';
      document.getElementById('submitBtn').textContent = 'Lưu thay đổi';
      document.getElementById('cancelEditBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteCard(id) {
      if (confirm('Bạn có chắc chắn muốn xóa từ này?')) {
        cards = cards.filter(c => c.id != id);
        deleteCardFromCloud(id);
        renderWordList();
        renderStudyCard();
      }
    }

    function resetForm() {
      document.getElementById('editCardId').value = '';
      document.getElementById('traditional').value = '';
      document.getElementById('pinyin').value = '';
      document.getElementById('vietnamese').value = '';
      document.getElementById('example').value = '';

      document.getElementById('formTitle').textContent = 'Thêm từ vựng mới';
      document.getElementById('submitBtn').textContent = 'Lưu vào bộ thẻ (Offline & Cloud)';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }
  </script>
</body>
